name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev pkg-config libgl1-mesa-dev libgles2-mesa-dev zlib1g-dev libffi-dev libssl-dev autoconf automake libtool

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Clean previous builds
        run: |
          buildozer android clean || true

      - name: Build APK and save full log
        id: build_step
        continue-on-error: true # Позволяет продолжить выполнение, даже если сборка упала, чтобы мы могли сохранить лог
        run: |
          buildozer android debug 2>&1 | tee buildozer_full.log

      - name: Extract Errors from Log
        run: |
          echo "========================================="
          echo "=== ПОИСК ОШИБОК В ЛОГЕ (GREP) ==="
          echo "========================================="
          grep -i -B 10 -A 10 "error\|traceback\|failed\|syntax" buildozer_full.log || echo "Специфических слов не найдено, ошибка может быть в кодировке."

      - name: Upload Full Log as Artifact
        uses: actions/upload-artifact@v4
        if: always() # Загружает лог ВСЕГДА, даже при ошибке
        with:
          name: full-buildozer-log
          path: buildozer_full.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: steps.build_step.outcome == 'success'
        with:
          name: Sudoku-APK
          path: bin/*.apk
