name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev pkg-config libgl1-mesa-dev libgles2-mesa-dev zlib1g-dev libffi-dev libssl-dev autoconf automake libtool

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build APK and save log
        id: build_step
        continue-on-error: true
        run: |
          buildozer android clean || true
          buildozer -v android debug 2>&1 | tee buildozer_full.log

      - name: Show REAL error (Last 100 lines)
        if: always()
        run: |
          echo "=================================================="
          echo "=== НАСТОЯЩАЯ ОШИБКА (ПОСЛЕДНИЕ 100 СТРОК) ==="
          echo "=================================================="
          tail -n 100 buildozer_full.log

      - name: Upload Full Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-buildozer-log
          path: buildozer_full.log

      - name: Upload APK
        if: steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-APK
          path: bin/*.apk
