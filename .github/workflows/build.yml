name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev pkg-config libgl1-mesa-dev libgles2-mesa-dev zlib1g-dev libffi-dev libssl-dev autoconf automake libtool wget unzip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Ultimate Android SDK Fix (Symlink Trick)
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          
          # 1. Скачиваем современные cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
          mkdir -p /tmp/cmdline_tmp
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline_tmp
          
          # 2. Кладем их в правильную современную папку
          mkdir -p $SDK_DIR/cmdline-tools/latest
          mv /tmp/cmdline_tmp/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
          
          # 3. МАГИЯ: Создаем старую папку tools и делаем ссылку на sdkmanager, чтобы обмануть Buildozer
          mkdir -p $SDK_DIR/tools/bin
          ln -s $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
          ln -s $SDK_DIR/cmdline-tools/latest/bin/avdmanager $SDK_DIR/tools/bin/avdmanager
          
          # 4. Файлы лицензий
          mkdir -p $SDK_DIR/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_DIR/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $SDK_DIR/licenses/android-sdk-preview-license
          
          # 5. Явное принятие лицензий через реальный sdkmanager
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          buildozer android clean || true
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-APK
          path: bin/*.apk
